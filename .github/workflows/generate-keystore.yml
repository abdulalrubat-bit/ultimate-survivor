name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ultimatesurvivor \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Fateful Games, OU=Fateful Games, O=Fateful Games, L=Melbourne, ST=Victoria, C=AU"
          base64 -w 0 release.keystore > keystore.base64.txt
          echo "--- fingerprint ---"
          keytool -list -v -keystore release.keystore -storepass "$KS_PASS" | head -20

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-THIS-FOREVER
          path: |
            release.keystore
            keystore.base64.txt
          retention-days: 90

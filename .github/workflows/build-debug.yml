name: Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ultimate-survivor.html"
      - "assets/**"
      - ".github/workflows/build-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the assets folder is really a folder
        run: |
          test -d assets || { echo "::error::assets/ is missing or is a file, not a folder"; exit 1; }
          for f in icon-only icon-foreground icon-background splash splash-dark; do
            test -f "assets/$f.png" || { echo "::error::assets/$f.png is missing"; exit 1; }
          done
          echo "all five source images present"

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Ultimate Survivor" com.fatefulgames.ultimatesurvivor --web-dir=www
          mkdir -p www
          cp ultimate-survivor.html www/index.html
          npx cap add android

      - name: Set dark background so cold start doesn't flash white
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.android = Object.assign({}, c.android, { backgroundColor: '#0a0e14' });
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          "
          npx cap sync android

      - name: Generate icons and splash
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android \
            --splashBackgroundColor '#20143E' \
            --splashBackgroundColorDark '#20143E' \
            --iconBackgroundColor '#0A0E14' \
            --iconBackgroundColorDark '#0A0E14'
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png \
            || { echo "::error::icon generation produced nothing"; exit 1; }

      - name: Lock to portrait
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' $MANIFEST
          grep -q 'screenOrientation="portrait"' $MANIFEST \
            || { echo "::error::portrait patch did not apply"; exit 1; }

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-survivor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
